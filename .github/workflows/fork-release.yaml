name: Fork / Release

# Builds the Android TV app and publishes it as a GitHub release with the APK attached.
#
# Create a release by pushing a tag (for example `v0.1.0`) or by running this workflow manually
# with a version. Only the signed release build is published, never the debug build.
# Signing is required; without the signing secrets the workflow fails on purpose.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the "v" prefix (for example 0.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  # Optional signing configuration. Configure these repository secrets to publish a signed
  # release APK that can be installed over previous builds:
  #   KEYSTORE          base64 encoded keystore file
  #   KEYSTORE_PASSWORD keystore password
  #   KEY_ALIAS         signing key alias
  #   KEY_PASSWORD      signing key password
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the changelog is built from the commits since the previous tag.
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version-file: .tools-versions

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::Unable to determine the version to build"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE secret is required to publish release builds"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"

      - name: Assemble release APK
        run: |
          ./gradlew :app:assembleRelease \
            "-Pjellyfin.version=${{ steps.version.outputs.version }}" \
            -Pkeystore.file="$RUNNER_TEMP/keystore.jks" \
            -Pkeystore.password="$KEYSTORE_PASSWORD" \
            -Psigning.key.alias="$KEY_ALIAS" \
            -Psigning.key.password="$KEY_PASSWORD"

      - name: Collect artifacts
        run: |
          mkdir -p build/fork-release
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} build/fork-release/ \;
          ls -la build/fork-release

      # The in-app updater reads latest.json from the newest release through
      # https://github.com/<owner>/<repo>/releases/latest/download/latest.json and compares versionCode
      # with BuildConfig.VERSION_CODE. The APK name is globbed so it always matches what Gradle wrote.
      - name: Write update manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"

          # Same formula as buildSrc/VersionUtils.getVersionCode: MA.MI.PA-PR -> MAMIPAPR,
          # with the pre-release number defaulting to 99.
          CORE="${VERSION%%-*}"
          MAJOR=$(echo "$CORE" | cut -d '.' -f 1)
          MINOR=$(echo "$CORE" | cut -d '.' -f 2)
          PATCH=$(echo "$CORE" | cut -d '.' -f 3)
          PRE=$(echo "$VERSION" | sed -n 's/^[^-]*-[^.]*\.\([0-9]\{1,\}\)$/\1/p')
          VERSION_CODE=$(( MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + ${PRE:-99} ))

          APK=$(find build/fork-release -name '*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::No release APK found"
            exit 1
          fi

          NAME=$(basename "$APK")
          SIZE=$(stat -c '%s' "$APK")
          SHA=$(sha256sum "$APK" | cut -d ' ' -f 1)

          cat > build/fork-release/latest.json <<EOF
          {
            "version": "$VERSION",
            "versionCode": $VERSION_CODE,
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "variants": {
              "tv": {
                "url": "https://github.com/$REPO/releases/download/v$VERSION/$NAME",
                "size": $SIZE,
                "sha256": "$SHA"
              }
            }
          }
          EOF

          cat build/fork-release/latest.json

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"

          # Changelog: the fork's own commits since the previous release tag, plus the upstream
          # commits pulled in by merges, grouped so it is obvious what came from where.
          #
          # The previous tag must come from THIS repository's releases: the clone also contains all
          # upstream tags (v0.19.x, v0.20.0-beta.x, ...) because the fork merges upstream, and those
          # sort higher than the fork's own v0.1.x line.
          PREVIOUS_TAG=$(gh release list --limit 20 --json tagName --jq '.[].tagName' \
            | grep -v "^$TAG$" | head -1 || true)
          if [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)
          fi

          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="$PREVIOUS_TAG..$GITHUB_SHA"
          else
            RANGE="$GITHUB_SHA"
          fi

          # `--first-parent` keeps only the fork's own commits on the mainline, so the upstream
          # commits pulled in by merges are not repeated in both sections.
          CHANGELOG=$(git log --no-merges --first-parent --pretty='- %s' "$RANGE" || true)
          [ -z "$CHANGELOG" ] && CHANGELOG="- No changes"

          # A merge commit created by `git merge upstream/master` has our branch as its first parent
          # and the upstream branch as its second, so `M^1..M^2` is exactly what the merge brought in.
          UPSTREAM_NOTES=""
          for merge in $(git rev-list --merges "$RANGE"); do
            brought_in=$(git log --no-merges --pretty='- %s' "$merge^1..$merge^2" 2>/dev/null || true)
            if [ -n "$brought_in" ]; then
              UPSTREAM_NOTES="$UPSTREAM_NOTES$brought_in
          "
            fi
          done
          UPSTREAM_NOTES=$(printf '%s' "$UPSTREAM_NOTES" | sort -u | sed '/^$/d')

          NOTES=$(cat <<EOF
          Automated build of Jellykulik for Android TV (Jellyfin for Android TV fork).

          Version: \`$VERSION\`
          Commit: \`$GITHUB_SHA\`

          ### Changes

          $CHANGELOG

          ### Downloads

          | APK | Description |
          | --- | --- |
          | \`jellyfin-androidtv-v$VERSION-release.apk\` | Signed release build |
          `latest.json` describes the build and is read by the in-app updater, so installed apps
          offer this version without any further setup.
          This is a release build signed with the fork's signing key, so it updates in place.
          EOF
          )

          if [ -n "$UPSTREAM_NOTES" ]; then
            NOTES="$NOTES

          ### Upstream changes included

          $UPSTREAM_NOTES"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES"

            # Drop assets from earlier runs so only the current build remains.
            for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              gh release delete-asset "$TAG" "$asset" --yes
            done
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA"
          fi

          gh release upload "$TAG" build/fork-release/*.apk build/fork-release/latest.json --clobber
